adminUsers:
  get:
    tags: [Admin]
    summary: List users (admin)
    operationId: adminListUsers
    parameters:
      - name: query
        in: query
        required: false
        description: "Search by email/username/fullName"
        schema:
          type: string

      - name: role
        in: query
        required: false
        schema:
          $ref: ../components/schemas/auth.yaml#/RegisterRole

      - name: isLocked
        in: query
        required: false
        schema:
          type: boolean

      - name: isVerified
        in: query
        required: false
        schema:
          type: boolean

      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0

      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100

      - name: sort
        in: query
        required: false
        description: "Example: createdAt,desc"
        schema:
          type: string
          example: "createdAt,desc"

    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common.yaml#/SuccessResponse
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/admin.yaml#/AdminUserListResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403

adminUserById:
  parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  get:
    tags: [Admin]
    summary: Get user detail (admin)
    operationId: adminGetUserDetail
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common.yaml#/SuccessResponse
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/admin.yaml#/AdminUserDetail
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404

adminUserLock:
  parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  put:
    tags: [Admin]
    summary: Lock a user account
    operationId: adminLockUser
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/admin.yaml#/AdminLockRequest
          examples:
            sample:
              value:
                reason: "Suspicious activity / spam"
    responses:
      "200":
        description: Locked
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SuccessResponseVoid
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

adminUserUnlock:
  parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  put:
    tags: [Admin]
    summary: Unlock a user account
    operationId: adminUnlockUser
    responses:
      "200":
        description: Unlocked
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SuccessResponseVoid
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

adminUserResetPassword:
  parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  put:
    tags: [Admin]
    summary: Reset user password (admin)
    description: "Resets user's password and optionally sends the new password to user's email."
    operationId: adminResetUserPassword
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/admin.yaml#/AdminResetPasswordRequest
          examples:
            send_email:
              value:
                sendEmail: true
    responses:
      "200":
        description: Reset success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SuccessResponseVoid
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409
      "429":
        $ref: ../components/responses/errors.yaml#/Error429