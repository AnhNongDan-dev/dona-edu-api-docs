problemsCollection:
  post:
    tags: [Problems]
    summary: Create problem
    operationId: problemCreate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/problem.yaml#/ProblemCreateRequest
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common.yaml#/SuccessResponse
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/problem.yaml#/ProblemCreateResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

  get:
    tags: [ Problems ]
    summary: List problems
    operationId: problemList
    parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: isPublished
        in: query
        required: false
        schema:
          type: boolean
      - name: difficulty
        in: query
        required: false
        schema:
          $ref: ../components/schemas/problem.yaml#/ProblemDifficulty
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
      - name: sort
        in: query
        required: false
        description: "Example: createdAt,desc"
        schema:
          type: string
          example: "createdAt,desc"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common.yaml#/SuccessResponse
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/problem.yaml#/ProblemListResponse
            example:
              success: true
              data:
                data:
                  - id: 101
                    title: "A + B"
                    difficulty: "EASY"
                    categories:
                      - id: 10
                        type: "PROBLEM_CATEGORY"
                        name: "Math"
                        description: "Basic math problems"
                    solutionGuide: "Read two integers, compute their sum, then print the result."
                    isPublished: false
                    createdAt: "2026-03-05T09:00:00Z"
                    createdBy: 9001
                  - id: 102
                    title: "Max of Three Numbers"
                    difficulty: "MEDIUM"
                    categories:
                      - id: 11
                        type: "PROBLEM_CATEGORY"
                        name: "Implementation"
                        description: "Implementation problems"
                    solutionGuide: "Compare three numbers and keep the maximum value."
                    isPublished: true
                    createdAt: "2026-03-05T10:00:00Z"
                    createdBy: 9001
                paging:
                  page: 0
                  size: 20
                  totalElements: 2
                  totalPages: 1
                  hasNext: false
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403

problemById:
  parameters:
    - name: problemId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  get:
    tags: [Problems]
    summary: Get problem detail
    operationId: problemGetDetail
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common.yaml#/SuccessResponse
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/problem.yaml#/ProblemDetail
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404

  put:
    tags: [Problems]
    summary: Update problem
    operationId: problemUpdate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/problem.yaml#/ProblemUpdateRequest
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SuccessResponseVoid
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

  delete:
    tags: [Problems]
    summary: Delete problem
    operationId: problemDelete
    responses:
      "200":
        description: Deleted
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SuccessResponseVoid
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

