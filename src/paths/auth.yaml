authRegister:
  post:
    tags: [Auth]
    summary: Register new account
    operationId: authRegister
    security: []   # public
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/RegisterRequest
          examples:
            sample:
              value:
                email: "student01@dona.edu.vn"
                username: "student01"
                password: "P@ssw0rd123"
                displayName: "Nguyễn Văn A"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/RegisterResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

authVerify:
  post:
    tags: [Auth]
    summary: Verify account email by token
    operationId: authVerify
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/VerifyRequest
          examples:
            sample:
              value:
                token: "vfy_eyJhbGciOi..."
    responses:
      "200":
        description: Verified
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "404":
        $ref: ../components/responses/errors.yaml#/Error404

authResendVerify:
  post:
    tags: [Auth]
    summary: Resend verification email
    operationId: authResendVerify
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/ResendVerifyRequest
          examples:
            sample:
              value:
                email: "student01@dona.edu.vn"
    responses:
      "200":
        description: Sent (always ok to avoid user enumeration)
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "429":
        $ref: ../components/responses/errors.yaml#/Error429

authLogin:
  post:
    tags: [Auth]
    summary: Login
    operationId: authLogin
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/LoginRequest
          examples:
            login_by_email:
              value:
                login: "student01@dona.edu.vn"
                password: "P@ssw0rd123"
            login_by_username:
              value:
                login: "student01"
                password: "P@ssw0rd123"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/LoginResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "429":
        $ref: ../components/responses/errors.yaml#/Error429

authLogout:
  post:
    tags: [Auth]
    summary: Logout
    operationId: authLogout
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "401":
        $ref: ../components/responses/errors.yaml#/Error401

authMe:
  get:
    tags: [Auth]
    summary: Get current user profile
    operationId: authMe
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/MeResponse
      "401":
        $ref: ../components/responses/errors.yaml#/Error401

authForgotPassword:
  post:
    tags: [Auth]
    summary: Send a temporary password to email
    description: "Generates a one-time temporary password and sends it to the user's email. Always returns OK to prevent account enumeration."
    operationId: authForgotPassword
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/ForgotPasswordRequest
          examples:
            sample:
              value:
                email: "student01@dona.edu.vn"
    responses:
      "200":
        description: Sent (always ok)
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "429":
        $ref: ../components/responses/errors.yaml#/Error429

authChangePassword:
  post:
    tags: [Auth]
    summary: Change password (logged-in user)
    operationId: authChangePassword
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/ChangePasswordRequest
          examples:
            sample:
              value:
                currentPassword: "P@ssw0rd123"
                newPassword: "NewP@ssw0rd123"
    responses:
      "200":
        description: Changed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403