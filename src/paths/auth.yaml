/auth/register:
  post:
    tags: [Auth]
    summary: Register new account
    operationId: authRegister
    security: []  # public
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/RegisterRequest
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/RegisterResponse
      "400": { $ref: ../components/responses/errors.yaml#/Error400 }
      "409": { $ref: ../components/responses/errors.yaml#/Error409 }

/auth/verify:
  post:
    tags: [Auth]
    summary: Verify account email by token
    operationId: authVerify
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/VerifyRequest
    responses:
      "200":
        description: Verified
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "400": { $ref: ../components/responses/errors.yaml#/Error400 }
      "404": { $ref: ../components/responses/errors.yaml#/Error404 }

/auth/resend-verify:
  post:
    tags: [Auth]
    summary: Resend verification email
    operationId: authResendVerify
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/ResendVerifyRequest
    responses:
      "200":
        description: Sent
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "400": { $ref: ../components/responses/errors.yaml#/Error400 }

/auth/login:
  post:
    tags: [Auth]
    summary: Login
    operationId: authLogin
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/LoginRequest
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/LoginResponse
      "400": { $ref: ../components/responses/errors.yaml#/Error400 }
      "401": { $ref: ../components/responses/errors.yaml#/Error401 }
      "403": { $ref: ../components/responses/errors.yaml#/Error403 }

/auth/logout:
  post:
    tags: [Auth]
    summary: Logout
    operationId: authLogout
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "401": { $ref: ../components/responses/errors.yaml#/Error401 }

/auth/me:
  get:
    tags: [Auth]
    summary: Get current user profile
    operationId: authMe
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/MeResponse
      "401": { $ref: ../components/responses/errors.yaml#/Error401 }

/auth/forgot-password:
  post:
    tags: [Auth]
    summary: Request password reset email
    operationId: authForgotPassword
    security: []
    requestBody:
      required: true
