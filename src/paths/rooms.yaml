# src/paths/rooms.yaml

roomsCollection:
  post:
    tags: [Rooms]
    summary: Create room
    operationId: roomCreate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/room.yaml#/RoomCreateRequest
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/room.yaml#/RoomCreateResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403

  get:
    tags: [Rooms]
    summary: List rooms
    operationId: roomList
    parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: isArchived
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
      - name: sort
        in: query
        required: false
        description: "Example: createdAt,desc"
        schema:
          type: string
          example: "createdAt,desc"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/room.yaml#/RoomListResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403

roomById:
  parameters:
    - name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  get:
    tags: [Rooms]
    summary: Get room detail
    operationId: roomGetDetail
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/room.yaml#/RoomDetail
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404

  put:
    tags: [Rooms]
    summary: Update room
    operationId: roomUpdate
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/room.yaml#/RoomUpdateRequest
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

  delete:
    tags: [Rooms]
    summary: Delete room
    operationId: roomDelete
    responses:
      "200":
        description: Deleted
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

roomArchive:
  parameters:
    - name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  put:
    tags: [Rooms]
    summary: Archive room
    operationId: roomArchive
    responses:
      "200":
        description: Archived
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

roomMembers:
  parameters:
    - name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  get:
    tags: [Rooms]
    summary: List room members
    operationId: roomListMembers
    parameters:
      - name: q
        in: query
        required: false
        description: "Search by username/displayName"
        schema:
          type: string
      - name: roleInRoom
        in: query
        required: false
        schema:
          type: string
          enum: [OWNER, TEACHER, STUDENT]
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: ../components/schemas/room-member.yaml#/RoomMemberListResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404

  post:
    tags: [Rooms]
    summary: Add members to room
    operationId: roomAddMembers
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/room-member.yaml#/RoomMemberAddRequest
          examples:
            add_students:
              value:
                userIds: [1001, 1002]
                roleInRoom: STUDENT
    responses:
      "200":
        description: Added
        content:
          application/json:
            schema:
              $ref: ../components/schemas/room-member.yaml#/RoomMemberAddResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409

roomMemberByUserId:
  parameters:
    - name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  delete:
    tags: [Rooms]
    summary: Remove member from room
    operationId: roomRemoveMember
    responses:
      "200":
        description: Removed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/SimpleOkResponse
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403
      "404":
        $ref: ../components/responses/errors.yaml#/Error404
      "409":
        $ref: ../components/responses/errors.yaml#/Error409