contestsActiveUpcoming:
  get:
    tags: [Dashboard]
    summary: List active & upcoming contests
    operationId: contestsActiveUpcoming
    parameters:
      - name: roomId
        in: query
        required: false
        schema:
          type: integer
          format: int64

      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
          maximum: 100
      - name: sort
        in: query
        required: false
        description: "Example: startAt,asc"
        schema:
          type: string
          example: "startAt,asc"

    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common.yaml#/SuccessResponse
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/dashboard.yaml#/ContestActiveUpcomingPagedResponse
      "400":
        $ref: ../components/responses/errors.yaml#/Error400
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403

statsTopAcUsers:
  get:
    tags: [Dashboard]
    summary: Top users by AC count
    operationId: statsTopAcUsers
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 5
          minimum: 1
          maximum: 50
      - name: roomId
        in: query
        required: false
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../components/schemas/common.yaml#/SuccessResponse
                - type: object
                  properties:
                    data:
                      $ref: ../components/schemas/dashboard.yaml#/TopAcUsersResponse
      "401":
        $ref: ../components/responses/errors.yaml#/Error401
      "403":
        $ref: ../components/responses/errors.yaml#/Error403

