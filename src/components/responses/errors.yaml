Error400:
  description: Bad Request
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ErrorResponse
      examples:
        E_INVALID_REQUEST:
          value: { code: E_INVALID_REQUEST, message: "Invalid request" }
        E_VALIDATION:
          value: { code: E_VALIDATION, message: "Validation error" }
        E_MISSING_FIELD:
          value: { code: E_MISSING_FIELD, message: "Missing required field" }
        E_INVALID_FIELD_FORMAT:
          value: { code: E_INVALID_FIELD_FORMAT, message: "Invalid field format" }
        E_INVALID_ENUM:
          value: { code: E_INVALID_ENUM, message: "Invalid enum value" }
        E_MALFORMED_JSON:
          value: { code: E_MALFORMED_JSON, message: "Malformed JSON" }

Error401:
  description: Unauthorized
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ErrorResponse
      examples:
        E_AUTH_REQUIRED:
          value: { code: E_AUTH_REQUIRED, message: "Authentication required" }
        E_AUTH_INVALID_TOKEN:
          value: { code: E_AUTH_INVALID_TOKEN, message: "Invalid token" }
        E_AUTH_TOKEN_EXPIRED:
          value: { code: E_AUTH_TOKEN_EXPIRED, message: "Token expired" }
        E_AUTH_SESSION_REVOKED:
          value: { code: E_AUTH_SESSION_REVOKED, message: "Session revoked" }
        E_AUTH_INVALID_CREDENTIALS:
          value: { code: E_AUTH_INVALID_CREDENTIALS, message: "Invalid credentials" }
        E_AUTH_MFA_INVALID:
          value: { code: E_AUTH_MFA_INVALID, message: "Invalid MFA/OTP" }

