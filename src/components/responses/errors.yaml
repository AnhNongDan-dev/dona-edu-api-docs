Error400:
  description: Bad Request
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ErrorResponse
      examples:
        E_VALIDATION:
          value:
            success: false
            message: "Validation error"
            errorCode: E_VALIDATION
            errors:
              - fieldName: "email"
                code: "E_INVALID_FIELD_FORMAT"
                message: "Email is invalid"
        E_INVALID_REQUEST:
          value:
            success: false
            message: "Invalid request"
            errorCode: E_INVALID_REQUEST
            errors: []
        E_MISSING_FIELD:
          value:
            success: false
            message: "Missing required field"
            errorCode: E_MISSING_FIELD
            errors:
              - fieldName: "password"
                code: "required"
                message: "Password is required"
        E_INVALID_FIELD_FORMAT:
          value:
            success: false
            message: "Invalid field format"
            errorCode: E_INVALID_FIELD_FORMAT
            errors:
              - fieldName: "email"
                code: "format"
                message: "Email must be a valid email"
        E_INVALID_ENUM:
          value:
            success: false
            message: "Invalid enum value"
            errorCode: E_INVALID_ENUM
            errors:
              - fieldName: "role"
                code: "enum"
                message: "Role must be one of STUDENT, TEACHER"
        E_MALFORMED_JSON:
          value:
            success: false
            message: "Malformed JSON"
            errorCode: E_MALFORMED_JSON
            errors: []

