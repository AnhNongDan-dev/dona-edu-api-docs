        E_NOT_FOUND:
          value: { code: E_NOT_FOUND, message: "Not found" }
        E_REFERENCE_NOT_FOUND:
          value: { code: E_REFERENCE_NOT_FOUND, message: "Referenced resource not found" }
        E_FILE_NOT_FOUND:
          value: { code: E_FILE_NOT_FOUND, message: "File not found" }

