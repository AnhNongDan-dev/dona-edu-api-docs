        E_AUTH_ACCOUNT_DISABLED:
          value: { code: E_AUTH_ACCOUNT_DISABLED, message: "Account disabled" }
        E_AUTH_NOT_VERIFIED:
          value: { code: E_AUTH_NOT_VERIFIED, message: "Account not verified" }
        E_AUTH_MFA_REQUIRED:
          value: { code: E_AUTH_MFA_REQUIRED, message: "MFA required" }
        E_ROLE_NOT_ALLOWED:
          value: { code: E_ROLE_NOT_ALLOWED, message: "Role not allowed" }
        E_RESOURCE_ACCESS_DENIED:
          value: { code: E_RESOURCE_ACCESS_DENIED, message: "Resource access denied" }
        E_NOT_ALLOWED:
          value: { code: E_NOT_ALLOWED, message: "Operation not allowed" }
        E_CAPTCHA_REQUIRED:
          value: { code: E_CAPTCHA_REQUIRED, message: "Captcha required" }

