ProblemCreateRequest:
  type: object
  required: [title, statement, timeLimitMs, memoryLimitMb]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      example: "A + B"
    statement:
      type: string
      minLength: 1
      maxLength: 50000
      description: "Problem statement (markdown or plain text)"
      example: "Given two integers a and b, output a+b."
    inputSpec:
      type: string
      nullable: true
      maxLength: 20000
      example: "Two integers a and b."
    outputSpec:
      type: string
      nullable: true
      maxLength: 20000
      example: "Print a+b."
    constraints:
      type: string
      nullable: true
      maxLength: 20000
      example: "0 ≤ a,b ≤ 10^9"
    timeLimitMs:
      type: integer
      format: int32
      minimum: 100
      maximum: 60000
      example: 1000
    memoryLimitMb:
      type: integer
      format: int32
      minimum: 32
      maximum: 2048
      example: 256
    difficulty:
      type: string
      nullable: true
      description: "Optional difficulty label"
      example: "EASY"
    isPublic:
      type: boolean
      default: false
      example: false

ProblemUpdateRequest:
  type: object
  properties:
    title: { type: string, minLength: 1, maxLength: 200 }
    statement: { type: string, minLength: 1, maxLength: 50000 }
    inputSpec: { type: string, nullable: true, maxLength: 20000 }
    outputSpec: { type: string, nullable: true, maxLength: 20000 }
    constraints: { type: string, nullable: true, maxLength: 20000 }
    timeLimitMs: { type: integer, format: int32, minimum: 100, maximum: 60000 }
    memoryLimitMb: { type: integer, format: int32, minimum: 32, maximum: 2048 }
    difficulty: { type: string, nullable: true }
    isPublic: { type: boolean, nullable: true }

ProblemCreateResponse:
  type: object
  required: [id]
  properties:
    id:
      type: integer
      format: int64
      example: 101

ProblemSummary:
  type: object
  required: [id, roomId, title, isPublished, createdAt, createdBy]
  properties:
    id: { type: integer, format: int64, example: 101 }
    roomId: { type: integer, format: int64, example: 1 }
    title: { type: string, example: "A + B" }
    difficulty: { type: string, nullable: true, example: "EASY" }
    isPublic: { type: boolean, example: false }
    isPublished: { type: boolean, example: false }
    createdAt: { type: string, format: date-time }
    createdBy: { type: integer, format: int64, example: 9001 }

ProblemDetail:
  allOf:
    - $ref: ./problem.yaml#/ProblemSummary
    - type: object
      properties:
        statement: { type: string }
        inputSpec: { type: string, nullable: true }
        outputSpec: { type: string, nullable: true }
        constraints: { type: string, nullable: true }
        timeLimitMs: { type: integer, format: int32 }
        memoryLimitMb: { type: integer, format: int32 }
        publishedAt: { type: string, format: date-time, nullable: true }

ProblemListResponse:
  type: object
  required: [items, page, size, total]
  properties:
    items:
      type: array
      items:
        $ref: ./problem.yaml#/ProblemSummary
    page: { type: integer, format: int32, example: 1 }
    size: { type: integer, format: int32, example: 20 }
    total: { type: integer, format: int64, example: 120 }