ProblemDifficulty:
  type: string
  enum: [EASY, MEDIUM, HARD]
  example: EASY

CategorySummary:
  type: object
  required: [id, type, name]
  properties:
    id:
      type: integer
      format: int64
      example: 10
    type:
      type: string
      example: "PROBLEM_CATEGORY"
    name:
      type: string
      example: "Math"
    description:
      type: string
      nullable: true
      example: "Basic math problems"

ProblemSample:
  type: object
  required: [input, output]
  properties:
    input:
      type: string
      example: "1 2"
    output:
      type: string
      example: "3"

ProblemLanguageConfig:
  type: object
  required: [id, memoryLimitMb, timeLimitMs]
  properties:
    id:
      type: integer
      format: int64
      example: 1
    memoryLimitMb:
      type: integer
      format: int32
      example: 256
    timeLimitMs:
      type: integer
      format: int32
      example: 1000

ProblemCreateRequest:
  type: object
  required: [title, difficulty]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      example: "A + B"
    statement:
      type: string
      minLength: 1
      maxLength: 50000
      example: "Given two integers a and b, output a+b."
    difficulty:
      $ref: ./problem.yaml#/ProblemDifficulty
    categoryIds:
      type: array
      items:
        type: integer
        format: int64
      example: [10, 12]
    solution:
      type: string
      nullable: true
      example: "Use operator + to compute result."
    solutionGuide:
      type: string
      nullable: true
      example: "Read two integers, compute their sum, then print the result."
    inputDescription:
      type: string
      nullable: true
    outputDescription:
      type: string
      nullable: true
    sampleInput:
      type: string
    samples:
      type: array
      minItems: 1
      items:
        $ref: ./problem.yaml#/ProblemSample
    languages:
      type: array
      minItems: 1
      items:
        $ref: ./problem.yaml#/ProblemLanguageConfig

ProblemUpdateRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    statement:
      type: string
      minLength: 1
      maxLength: 50000
    difficulty:
      $ref: ./problem.yaml#/ProblemDifficulty

    categoryIds:
      type: array
      items:
        type: integer
        format: int64

    solution:
      type: string
      nullable: true

    solutionGuide:
      type: string
      nullable: true

    inputDescription:
      type: string
      nullable: true

    outputDescription:
      type: string
      nullable: true

    sampleInput:
      type: string

    samples:
      type: array
      items:
        $ref: ./problem.yaml#/ProblemSample

    languages:
      type: array
      items:
        $ref: ./problem.yaml#/ProblemLanguageConfig

ProblemCreateResponse:
  type: object
  required: [id]
  properties:
    id:
      type: integer
      format: int64
      example: 101

ProblemSummary:
  type: object
  required: [id, title, difficulty, categories, isPublished, createdAt, createdBy]
  properties:
    id:
      type: integer
      format: int64
      example: 101
    title:
      type: string
      example: "A + B"
    difficulty:
      $ref: ./problem.yaml#/ProblemDifficulty
    categories:
      type: array
      items:
        $ref: ./problem.yaml#/CategorySummary
    isPublished:
      type: boolean
      example: false
    createdAt:
      type: string
      format: date-time
    createdBy:
      type: integer
      format: int64
      example: 9001

ProblemDetail:
  type: object
  required:
    - id
    - title
    - statement
    - difficulty
    - categories
    - sampleInput
    - samples
    - languages
    - isPublished
    - createdAt
    - createdBy
  properties:
    id:
      type: integer
      format: int64
      example: 101
    title:
      type: string
      example: "A + B"
    statement:
      type: string
      example: "Given two integers a and b, output a+b."
    difficulty:
      $ref: ./problem.yaml#/ProblemDifficulty
    categories:
      type: array
      items:
        $ref: ./problem.yaml#/CategorySummary
    solution:
      type: string
      nullable: true
      example: "Use operator +."
    solutionGuide:
      type: string
      nullable: true
      example: "Read two integers, compute their sum, then print the result."
    inputDescription:
      type: string
      nullable: true
      example: "Two integers a and b."
    outputDescription:
      type: string
      nullable: true
      example: "Print one integer."
    sampleInput:
      type: string
      example: "1 2"
    samples:
      type: array
      items:
        $ref: ./problem.yaml#/ProblemSample
    languages:
      type: array
      items:
        $ref: ./problem.yaml#/ProblemLanguageConfig
    isPublished:
      type: boolean
      example: false
    publishedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    createdBy:
      type: integer
      format: int64
      example: 9001
    updatedAt:
      type: string
      format: date-time
      nullable: true
    updatedBy:
      type: integer
      format: int64
      nullable: true

ProblemListResponse:
  type: object
  required: [data, paging]
  properties:
    data:
      type: array
      items:
        $ref: ./problem.yaml#/ProblemSummary
    paging:
      $ref: ./common.yaml#/Paging

RoomProblemAddRequest:
  type: object
  required: [problemId]
  properties:
    problemId:
      type: integer
      format: int64
      example: 101

RoomProblemAddResponse:
  type: object
  required: [roomId, problemId]
  properties:
    roomId:
      type: integer
      format: int64
      example: 1
    problemId:
      type: integer
      format: int64
      example: 101