RoomCreateRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      example: "Lớp 10A1 - Tin học"
    description:
      type: string
      nullable: true
      maxLength: 2000
      example: "Phòng luyện tập và thi thử"
    password:
      type: string
      nullable: true
      example: "Truongtho@1"
    isPublic:
      type: boolean
      default: false
      example: false

RoomUpdateRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      nullable: true
      maxLength: 2000
    startAt:
      type: string
      format: date-time
      nullable: true
    endAt:
      type: string
      format: date-time
      nullable: true
    isPublic:
      type: boolean
      nullable: true

RoomSummary:
  type: object
  required: [id, name, isArchived, createdAt, createdBy]
  properties:
    id:
      type: integer
      format: int64
      example: 1
    name:
      type: string
      example: "Lớp 10A1 - Tin học"
    isPublic:
      type: boolean
      example: false
    isArchived:
      type: boolean
      example: false
    startAt:
      type: string
      format: date-time
      nullable: true
    endAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    createdBy:
      type: integer
      format: int64
      description: Creator userId
      example: 9001

RoomDetail:
  allOf:
    - $ref: ./room.yaml#/RoomSummary
    - type: object
      properties:
        description:
          type: string
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true

RoomCreateResponse:
  type: object
  required: [id]
  properties:
    id:
      type: integer
      format: int64
      example: 1

RoomListResponse:
  type: object
  required: [data, paging]
  properties:
    data:
      type: array
      items:
        $ref: ./room.yaml#/RoomSummary
    paging:
      $ref: ./common.yaml#/Paging