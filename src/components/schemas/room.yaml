RoomCreateRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      example: "Lớp 10A1 - Tin học"
    description:
      type: string
      nullable: true
      maxLength: 2000
      example: "Phòng luyện tập và thi thử"
    password:
      type: string
      nullable: true
      example: "Truongtho@1"
    isPublic:
      type: boolean
      default: false
      example: false

RoomUpdateRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      type: string
      nullable: true
      maxLength: 2000
    startAt:
      type: string
      format: date-time
      nullable: true
    endAt:
      type: string
      format: date-time
      nullable: true
    isPublic:
      type: boolean
      nullable: true

RoomSummary:
  type: object
  required: [id, name, isArchived, createdAt, createdBy]
  properties:
    id:
      type: integer
      format: int64
      example: 1
    name:
      type: string
      example: "Lớp 10A1 - Tin học"
    isPublic:
      type: boolean
      example: false
    isArchived:
      type: boolean
      example: false
    startAt:
      type: string
      format: date-time
      nullable: true
    endAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    createdBy:
      type: integer
      format: int64
      description: Creator userId
      example: 9001

RoomDetail:
  type: object
  required:
    - id
    - code
    - isPublic
    - name
    - description
    - isArchived
    - archivedAt
    - createdAt
    - updatedAt
    - memberCount
    - contestCount
  properties:
    id: { type: integer, format: int64, example: 1 }
    code: { type: string, example: "BL-2026-A1" }
    isPublic: { type: boolean, example: false }
    name: { type: string, example: "Lớp 12A1 - Ôn OJ" }
    description: { type: string, nullable: true, example: "Room luyện tập lập trình cho 12A1" }

    isArchived: { type: boolean, example: false }
    archivedAt: { type: string, format: date-time, nullable: true, example: null }

    createdAt: { type: string, format: date-time, nullable: true, example: "2026-03-05T09:00:00Z" }
    updatedAt: { type: string, format: date-time, nullable: true, example: "2026-03-05T10:00:00Z" }

    memberCount: { type: integer, format: int32, example: 35 }
    contestCount: { type: integer, format: int32, example: 4 }

RoomCreateResponse:
  type: object
  required: [id]
  properties:
    id:
      type: integer
      format: int64
      example: 1

RoomListItem:
  type: object
  required: [id, code, isPublic, name, description, isArchived, archivedAt, createdAt, updatedAt, memberCount, contestCount]
  properties:
    id: { type: integer, format: int64, example: 1 }
    code: { type: string, example: "BL-2026-A1" }
    isPublic: { type: boolean, example: false }
    name: { type: string, example: "Lớp 12A1 - Ôn OJ" }
    description: { type: string, nullable: true, example: "Room luyện tập lập trình cho 12A1" }
    isArchived: { type: boolean, example: false }
    archivedAt: { type: string, format: date-time, nullable: true, example: null }
    createdAt: { type: string, format: date-time, nullable: true, example: "2026-03-05T09:00:00Z" }
    updatedAt: { type: string, format: date-time, nullable: true, example: "2026-03-05T10:00:00Z" }
    memberCount: { type: integer, format: int32, example: 35 }
    contestCount: { type: integer, format: int32, example: 4 }

RoomListResponse:
  type: object
  required: [data, paging]
  properties:
    data:
      type: array
      items:
        $ref: ./room.yaml#/RoomListItem
    paging:
      $ref: ./common.yaml#/Paging
  example:
    data:
      - id: 1
        code: "BL-2026-A1"
        isPublic: false
        name: "Lớp 12A1 - Ôn OJ"
        description: "Room luyện tập lập trình cho 12A1"
        isArchived: false
        archivedAt: null
        createdAt: "2026-03-05T09:00:00Z"
        updatedAt: "2026-03-05T10:00:00Z"
        memberCount: 35
        contestCount: 4
      - id: 2
        code: "BL-2026-12A2"
        isPublic: true
        name: "Lớp 12A2"
        description: null
        isArchived: false
        archivedAt: null
        createdAt: "2026-03-02T09:00:00Z"
        updatedAt: "2026-03-04T10:00:00Z"
        memberCount: 40
        contestCount: 2
    paging:
      page: 0
      size: 20
      totalElements: 125
      totalPages: 7
      hasNext: true