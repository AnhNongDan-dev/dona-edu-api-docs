UserPublicSummary:
  type: object
  required: [id, username, fullName]
  properties:
    id:
      type: integer
      format: int64
      example: 1001
    username:
      type: string
      example: "student01"
    fullName:
      type: string
      example: "Nguyễn Văn A"
    avatarUrl:
      type: string
      nullable: true
      example: "https://cdn.example.com/avatars/1001.png"

UserPublicDetail:
  type: object
  required: [id, username, fullName]
  properties:
    id:
      type: integer
      format: int64
      example: 1001
    username:
      type: string
      example: "student01"
    fullName:
      type: string
      example: "Nguyễn Văn A"
    avatarUrl:
      type: string
      nullable: true
      example: "https://cdn.example.com/avatars/1001.png"
    bio:
      type: string
      nullable: true
      example: "Học sinh lớp 10 chuyên Toán"
    createdAt:
      type: string
      format: date-time
      nullable: true

UserSearchResponse:
  type: object
  required: [data, paging]
  properties:
    data:
      type: array
      items:
        $ref: ./user.yaml#/UserPublicSummary
    paging:
      $ref: ./common.yaml#/Paging