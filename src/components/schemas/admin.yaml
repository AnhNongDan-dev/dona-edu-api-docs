AdminUserSummary:
  type: object
  required: [id, email, username, fullName, role, isVerified, isLocked, createdAt]
  properties:
    id: { type: integer, format: int64, example: 1001 }
    email: { type: string, format: email, example: "student01@dona.edu.vn" }
    username: { type: string, example: "student01" }
    fullName: { type: string, example: "Nguyễn Văn A" }
    role: { type: string, example: "STUDENT" }
    isVerified: { type: boolean, example: true }
    isLocked: { type: boolean, example: false }
    createdAt: { type: string, format: date-time }
    lastLoginAt: { type: string, format: date-time, nullable: true }

AdminUserDetail:
  allOf:
    - $ref: ./admin.yaml#/AdminUserSummary
    - type: object
      properties:
        lockedAt: { type: string, format: date-time, nullable: true }
        lockReason: { type: string, nullable: true }

AdminUserListResponse:
  type: object
  required: [items, page, size, total]
  properties:
    data:
      type: array
      items:
        $ref: ./admin.yaml#/AdminUserSummary
    paging:
      $ref: ./common.yaml#/Paging

AdminLockRequest:
  type: object
  required: [reason]
  properties:
    reason:
      type: string
      maxLength: 255
      example: "Suspicious activity / spam"

AdminResetPasswordRequest:
  type: object
  properties:
    sendEmail:
      type: boolean
      default: true
      description: Send new password to user's email
      example: true

AdminResetPasswordResponse:
  type: object
  required: [ok]
  properties:
    ok: { type: boolean, example: true }
    tempPassword:
      type: string
      nullable: true
      description: Optional. Only returned if server policy allows showing it to admin.
      example: "X9p2@K1m"