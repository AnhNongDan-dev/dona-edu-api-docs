ErrorItem:
  type: object
  required: [fieldName, code, message]
  properties:
    fieldName:
      type: string
      example: "email"
    code:
      type: string
      example: "E_INVALID_FIELD_FORMAT"
    message:
      type: string
      example: "Email is invalid"

ErrorResponse:
  type: object
  required: [success, message, errorCode, errors]
  properties:
    success:
      type: boolean
      enum: [false]
      example: false
    message:
      type: string
      example: "Validation failed"
    errorCode:
      type: string
      example: "E_VALIDATION"
    errors:
      type: array
      items:
        $ref: ./common.yaml#/ErrorItem

SimpleOkResponse:
  type: object
  required: [ok]
  properties:
    ok:
      type: boolean
      example: true

Paging:
  type: object
  required: [page, size, totalElements, totalPages, hasNext]
  properties:
    page:
      type: integer
      format: int32
      minimum: 0
      example: 0
    size:
      type: integer
      format: int32
      minimum: 1
      example: 20
    totalElements:
      type: integer
      format: int64
      example: 1250
    totalPages:
      type: integer
      format: int32
      example: 63
    hasNext:
      type: boolean
      example: true

SuccessResponse:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      enum: [true]
      example: true
    data: {}

SuccessResponseVoid:
  type: object
  required: [success, data]
  properties:
    success:
      type: boolean
      enum: [true]
      example: true
    data:
      type: object
      nullable: true
      example: null