ErrorResponse:
  type: object
  required: [code, message]
  properties:
    code:
      type: string
      example: E_VALIDATION
    message:
      type: string
      example: Invalid request
    details:
      type: object
      additionalProperties: true
      properties:
        fieldErrors:
          type: array
          description: Validation errors per field
          items:
            type: object
            required: [field, reason]
            properties:
              field:
                type: string
                example: email
              reason:
                type: string
                example: must be a well-formed email address