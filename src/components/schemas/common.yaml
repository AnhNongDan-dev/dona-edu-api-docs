ErrorResponse:
  type: object
  required: [code, message]
  properties:
    code:
      type: string
      example: E_VALIDATION
    message:
      type: string
      example: Invalid request
    details:
      type: object
      additionalProperties: true
      properties:
        fieldErrors:
          type: array
          description: Validation errors per field
          items:
            type: object
            required: [field, reason]
            properties:
              field:
                type: string
                example: email
              reason:
                type: string
                example: must be a well-formed email address
SimpleOkResponse:
  type: object
  required: [ok]
  properties:
    ok:
      type: boolean
      example: true

Paging:
  type: object
  required: [page, size, totalElements, totalPages, hasNext]
  properties:
    page:
      type: integer
      format: int32
      minimum: 0
      example: 0
    size:
      type: integer
      format: int32
      minimum: 1
      example: 20
    totalElements:
      type: integer
      format: int64
      example: 1250
    totalPages:
      type: integer
      format: int32
      example: 63
    hasNext:
      type: boolean
      example: true