RegisterRequest:
  type: object
  required: [email, username, password, fullName]
  properties:
    email:
      type: string
      format: email
      example: "student01@dona.edu.vn"

    username:
      type: string
      description: Unique username for login / display
      minLength: 3
      maxLength: 30
      pattern: "^[a-zA-Z0-9_\\.]+$"
      example: "student01"

    password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      example: "P@ssw0rd123"

    fullName:
      type: string
      minLength: 1
      maxLength: 100
      example: "Nguyễn Văn A"
    role:
      $ref: ./auth.yaml#/RegisterRole

RegisterResponse:
  type: object
  required: [userId, email, username, fullName, isVerified]
  properties:
    userId:
      type: integer
      format: int64
      example: 1001
    email:
      type: string
      format: email
      example: "student01@dona.edu.vn"
    username:
      type: string
      example: "student01"
    fullName:
      type: string
      example: "Nguyễn Văn A"
    role:
      $ref: ./auth.yaml#/RegisterRole
    isVerified:
      type: boolean
      example: false

VerifyRequest:
  type: object
  required: [otp]
  properties:
    otp:
      type: string
      description: Verify otp from email
      example: "vfy_eyJhbGciOi..."

ResendVerifyRequest:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email
      example: "student01@dona.edu.vn"

LoginRequest:
  type: object
  required: [usernameOrEmail, password]
  properties:
    usernameOrEmail:
      type: string
      description: Email or username
      example: "student01@dona.edu.vn"
    password:
      type: string
      format: password
      example: "P@ssw0rd123"

TokenPair:
  type: object
  required: [accessToken, tokenType, expiresIn]
  properties:
    accessToken:
      type: string
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    tokenType:
      type: string
      example: "Bearer"
    expiresIn:
      type: integer
      format: int32
      description: seconds
      example: 3600
    refreshToken:
      type: string
      nullable: true
      description: Optional (only if you implement refresh flow)
      example: "rfr_eyJhbGciOi..."

MeResponse:
  type: object
  required: [id, email, username, fullName, role, isVerified]
  properties:
    id: { type: integer, format: int64, example: 1001 }
    email: { type: string, format: email, example: "student01@dona.edu.vn" }
    username: { type: string, example: "student01" }
    fullName: { type: string, example: "Nguyễn Văn A" }
    role: { type: string, example: "STUDENT" }
    isVerified: { type: boolean, example: true }

LoginResponse:
  type: object
  required: [token]
  properties:
    token:
      type: string
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

ForgotPasswordRequest:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email
      example: "student01@dona.edu.vn"

ResetPasswordRequest:
  type: object
  required: [email, otp, newPassword]
  properties:
    email:
      type: string
      format: email
      example: "student01@dona.edu.vn"
      description: "Email"
    otp:
      type: string
      example: "12345"
      description: Reset otp from email
    newPassword:
      type: string
      minLength: 8
      example: "NewP@ssw0rd123"
      description: "New password to be set for the user"

ChangePasswordRequest:
  type: object
  required: [currentPassword, newPassword]
  properties:
    currentPassword:
      type: string
      format: password
      example: "P@ssw0rd123"
    newPassword:
      type: string
      format: password
      minLength: 8
      example: "NewP@ssw0rd123"

RegisterRole:
  type: string
  enum: [STUDENT, TEACHER]
  example: STUDENT