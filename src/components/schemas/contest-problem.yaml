ContestProblemSummary:
  type: object
  required: [problemId, ordinal, score]
  properties:
    problemId:
      type: integer
      format: int64
      example: 101
    ordinal:
      type: integer
      format: int32
      description: "Problem order in contest (1..N)"
      example: 1
    score:
      type: number
      format: float
      description: "Max score for this problem in contest"
      example: 100
    title:
      type: string
      nullable: true
      description: "Optional problem title for display"
      example: "A + B"
    isPublished:
      type: boolean
      nullable: true
      description: "Optional problem publish flag (if your system has it)"
      example: true

ContestProblemListResponse:
  type: object
  required: [data, paging]
  properties:
    data:
      type: array
      items:
        $ref: ./contest-problem.yaml#/ContestProblemSummary
    paging:
      $ref: ./common.yaml#/Paging

ContestProblemAssignItem:
  type: object
  required: [problemId]
  properties:
    problemId:
      type: integer
      format: int64
      example: 101
    ordinal:
      type: integer
      format: int32
      nullable: true
      description: "Optional. If omitted, append to the end."
      example: 1
    score:
      type: number
      format: float
      nullable: true
      description: "Optional. If omitted, use default problem max score."
      example: 100

ContestProblemAssignRequest:
  type: object
  required: [items]
  properties:
    items:
      type: array
      minItems: 1
      items:
        $ref: ./contest-problem.yaml#/ContestProblemAssignItem

ContestProblemAssignResponse:
  type: object
  required: [assignedCount]
  properties:
    assignedCount:
      type: integer
      format: int32
      example: 2