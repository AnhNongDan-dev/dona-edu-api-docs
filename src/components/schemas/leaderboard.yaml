LeaderboardRow:
  type: object
  required: [rank, userId, username, displayName, totalScore]
  properties:
    rank:
      type: integer
      format: int32
      example: 1
    userId:
      type: integer
      format: int64
      example: 1001
    username:
      type: string
      example: "student01"
    displayName:
      type: string
      example: "Nguyễn Văn A"
    problemScores:
      type: array
      description: "Scores aligned with contest problems order"
      items:
        type: number
        format: float
      example: [100, 80, 100]
    totalScore:
      type: number
      format: float
      example: 280
    lastSubmissionAt:
      type: string
      format: date-time
      nullable: true

LeaderboardPagedResponse:
  type: object
  required: [data, paging]
  properties:
    data:
      type: array
      items:
        $ref: ./leaderboard.yaml#/LeaderboardRow
    paging:
      $ref: ./common.yaml#/Paging