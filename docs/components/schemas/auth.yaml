RegisterRequest:
  type: object
  required: [email, password, displayName]
  properties:
    email:
      type: string
      format: email
      example: "student01@dona.edu.vn"
    password:
      type: string
      format: password
      minLength: 8
      example: "P@ssw0rd123"
    displayName:
      type: string
      minLength: 1
      maxLength: 100
      example: "Nguyễn Văn A"

RegisterResponse:
  type: object
  required: [userId, email, isVerified]
  properties:
    userId:
      type: integer
      format: int64
      example: 1001
    email:
      type: string
      format: email
      example: "student01@dona.edu.vn"
    isVerified:
      type: boolean
      example: false