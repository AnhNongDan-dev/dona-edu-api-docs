          example: STUDENT
    RoomMemberAddResponse:
      type: object
      required:
        - addedCount
      properties:
        addedCount:
          type: integer
          format: int32
          example: 2
    ContestSummary:
      type: object
      required:
        - id
        - roomId
        - title
        - isPublished
        - createdAt
        - createdBy
      properties:
        id:
          type: integer
          format: int64
