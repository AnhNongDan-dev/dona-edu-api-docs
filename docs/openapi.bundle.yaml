          example: 1
        score:
          type: number
          format: float
          description: Max score for this problem in contest
          example: 100
        title:
          type: string
          nullable: true
          description: Optional problem title for display
          example: A + B
        isPublished:
          type: boolean
          nullable: true
          description: Optional problem publish flag (if your system has it)
          example: true
