        roomId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Thi thử vòng 1 - Tuần 3
        isPublic:
          type: boolean
          example: false
        isPublished:
          type: boolean
          example: false
        startAt:
          type: string
          format: date-time
          nullable: true
        endAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
          example: 9001
    ContestListResponse:
      type: object
      required:
        - data
        - paging
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContestSummary'
        paging:
          $ref: '#/components/schemas/Paging'
    ContestCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Thi thử vòng 1 - Tuần 3
