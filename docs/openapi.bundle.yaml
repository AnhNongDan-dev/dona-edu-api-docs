openapi: 3.0.3
info:
  title: Dona edu API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://donasky.com/license
servers:
  - url: https://donasky.com
  - url: http://localhost:8080
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: Authentication APIs
  - name: Admin
    description: Admin management APIs
  - name: Users
    description: User search & public profiles
  - name: Rooms
    description: Room management APIs
  - name: Contests
    description: Contest management APIs
  - name: Problems
    description: Problem management APIs
  - name: Submissions
    description: Submission & judging APIs
  - name: Leaderboard
    description: Leaderboard APIs
  - name: Health
    description: Health check APIs
  - name: Dashboard
    description: Dashboard & statistics APIs
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register new account
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              sample:
                value:
                  email: student01@dona.edu.vn
                  username: student01
                  password: P@ssw0rd123
                  fullName: Nguyễn Văn A
                  role: STUDENT
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify account email by otp
      operationId: authVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            examples:
              sample:
                value:
                  otp: '245869'
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v1/auth/resend-verify:
    post:
      tags:
        - Auth
      summary: Resend verification email
      operationId: authResendVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerifyRequest'
            examples:
              sample:
                value:
                  email: student01@dona.edu.vn
      responses:
        '200':
          description: Sent (always ok to avoid user enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login_by_email:
                value:
                  usernameOrEmail: student01@dona.edu.vn
                  password: P@ssw0rd123
              login_by_username:
                value:
                  usernameOrEmail: student01
                  password: P@ssw0rd123
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      operationId: authLogout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '401':
          $ref: '#/components/responses/Error401'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user profile
      operationId: authMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error401'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Send a temporary password to email
      description: Generates a one-time temporary password and sends it to the user's email. Always returns OK to prevent account enumeration.
      operationId: authForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            examples:
              sample:
                value:
                  email: student01@dona.edu.vn
      responses:
        '200':
          description: Sent (always ok)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
  /api/v1/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password using otp
      operationId: authResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              sample:
                value:
                  email: student01@dona.edu.vn
                  otp: '347659'
                  newPassword: NewP@ssw0rd123
      responses:
        '200':
          description: Reset success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v1/auth/change-password:
    post:
      tags:
        - Auth
      summary: Change password (logged-in user)
      operationId: authChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              sample:
                value:
                  currentPassword: P@ssw0rd123
                  newPassword: NewP@ssw0rd123
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /api/v1/admin/users:
    get:
      tags:
        - Admin
      summary: List users (admin)
      operationId: adminListUsers
      parameters:
        - name: query
          in: query
          required: false
          description: Search by email/username/fullName
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RegisterRole'
        - name: isLocked
          in: query
          required: false
          schema:
            type: boolean
        - name: isVerified
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          description: 'Example: createdAt,desc'
          schema:
            type: string
            example: createdAt,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminUserListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /api/v1/admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Admin
      summary: Get user detail (admin)
      operationId: adminGetUserDetail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminUserDetail'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v1/admin/users/{userId}/lock:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Admin
      summary: Lock a user account
      operationId: adminLockUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLockRequest'
            examples:
              sample:
                value:
                  reason: Suspicious activity / spam
      responses:
        '200':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/admin/users/{userId}/unlock:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Admin
      summary: Unlock a user account
      operationId: adminUnlockUser
      responses:
        '200':
          description: Unlocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/admin/users/{userId}/reset-password:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags:
        - Admin
      summary: Reset user password (admin)
      description: Resets user's password and optionally sends the new password to user's email.
      operationId: adminResetUserPassword
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            examples:
              empty:
                value: {}
      responses:
        '200':
          description: Reset success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
  /api/v1/users/search:
    get:
      tags:
        - Users
      summary: Search users
      operationId: usersSearch
      parameters:
        - name: query
          in: query
          required: true
          description: Keyword to search by username or fullName
          schema:
            type: string
            minLength: 1
            example: nguyen
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          description: 'Example: createdAt,desc'
          schema:
            type: string
            example: createdAt,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserSearchResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Users
      summary: Get user public profile
      operationId: usersGetById
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPublicDetail'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v1/rooms:
    post:
      tags:
        - Rooms
      summary: Create room
      operationId: roomCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomCreateResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
    get:
      tags:
        - Rooms
      summary: List rooms
      operationId: roomList
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: isArchived
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          description: 'Example: createdAt,desc'
          schema:
            type: string
            example: createdAt,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /api/v1/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Rooms
      summary: Get room detail
      operationId: roomGetDetail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomDetail'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    put:
      tags:
        - Rooms
      summary: Update room
      operationId: roomUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
    delete:
      tags:
        - Rooms
      summary: Delete room
      operationId: roomDelete
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/rooms/{roomId}/archive:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
        - Rooms
      summary: Archive room
      operationId: roomArchive
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/rooms/{roomId}/members:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Rooms
      summary: List room members
      operationId: roomListMembers
      parameters:
        - name: query
          in: query
          required: false
          description: Search by username/fullName
          schema:
            type: string
        - name: roleInRoom
          in: query
          required: false
          schema:
            type: string
            enum:
              - OWNER
              - TEACHER
              - STUDENT
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          description: 'Example: joinedAt,desc'
          schema:
            type: string
            example: joinedAt,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomMemberListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    post:
      tags:
        - Rooms
      summary: Add members to room
      operationId: roomAddMembers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomMemberAddRequest'
            examples:
              add_students:
                value:
                  userIds:
                    - 1001
                    - 1002
                  roleInRoom: STUDENT
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomMemberAddResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/rooms/{roomId}/members/{userId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags:
        - Rooms
      summary: Remove member from room
      operationId: roomRemoveMember
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/rooms/{roomId}/contests:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags:
        - Contests
      summary: Create contest in room
      operationId: contestCreateInRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContestCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ContestCreateResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
    get:
      tags:
        - Contests
      summary: List contests in room
      operationId: contestListInRoom
      parameters:
        - name: query
          in: query
          required: false
          description: Search by title
          schema:
            type: string
        - name: isPublished
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          required: false
          description: 'Example: createdAt,desc'
          schema:
            type: string
            example: createdAt,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ContestListResponse'
        '400':
