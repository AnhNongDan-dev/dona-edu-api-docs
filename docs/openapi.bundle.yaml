                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ContestActiveUpcomingPagedResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /stats/top-ac-users:
    get:
      tags:
        - Dashboard
      summary: Top users by AC count
      operationId: statsTopAcUsers
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 5
            minimum: 1
            maximum: 50
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TopAcUsersResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /me/problems/next-unsolved:
    get:
      tags:
        - Dashboard
      summary: Get latest problem that current user has not solved (no AC yet)
      operationId: meNextUnsolvedProblem
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NextUnsolvedProblemResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /me/problems/progress:
    get:
      tags:
        - Dashboard
      summary: Get current user AC progress by difficulty
      operationId: meProblemProgress
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProblemProgressResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /rooms/{roomId}/join:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags:
        - Rooms
      summary: Join room (self) by code and password
      operationId: roomJoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomJoinRequest'
            examples:
              sample:
                value:
                  code: BL-2026-A1
                  password: room@123
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomJoinResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
  /rooms/{roomId}/members/me:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags:
        - Rooms
      summary: Leave room (self)
      operationId: roomLeaveMe
      responses:
        '200':
          description: Left
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseVoid'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRole:
      type: string
      enum:
        - STUDENT
        - TEACHER
      example: STUDENT
    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
        username:
          type: string
          description: Unique username for login / display
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_\.]+$
          example: student01
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: P@ssw0rd123
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          example: Nguyễn Văn A
        role:
          $ref: '#/components/schemas/RegisterRole'
    SuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
          example: true
        data: {}
    RegisterResponse:
      type: object
      required:
        - userId
        - email
        - username
        - fullName
        - isVerified
      properties:
        userId:
          type: integer
          format: int64
          example: 1001
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
        username:
          type: string
          example: student01
        fullName:
          type: string
          example: Nguyễn Văn A
        role:
          $ref: '#/components/schemas/RegisterRole'
        isVerified:
          type: boolean
          example: false
    ErrorItem:
      type: object
      required:
        - fieldName
        - code
        - message
      properties:
        fieldName:
          type: string
          example: email
        code:
          type: string
          example: E_INVALID_FIELD_FORMAT
        message:
          type: string
          example: Email is invalid
    ErrorResponse:
      type: object
      required:
        - success
        - message
        - errorCode
        - errors
      properties:
        success:
          type: boolean
          enum:
            - false
          example: false
        message:
          type: string
          example: Validation failed
        errorCode:
          type: string
          example: E_VALIDATION
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
    VerifyRequest:
      type: object
      required:
        - otp
      properties:
        otp:
          type: string
          description: Verify otp from email
          example: vfy_eyJhbGciOi...
    SuccessResponseVoid:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
          example: true
        data:
          type: object
          nullable: true
          example: null
    ResendVerifyRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
    LoginRequest:
      type: object
      required:
        - usernameOrEmail
        - password
      properties:
        usernameOrEmail:
          type: string
          description: Email or username
          example: student01@dona.edu.vn
        password:
          type: string
          format: password
          example: P@ssw0rd123
    LoginResponse:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    MeResponse:
      type: object
      required:
        - id
        - email
        - username
        - fullName
        - role
        - isVerified
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
        username:
          type: string
          example: student01
        fullName:
          type: string
          example: Nguyễn Văn A
        role:
          type: string
          example: STUDENT
        isVerified:
          type: boolean
          example: true
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
    ResetPasswordRequest:
      type: object
      required:
        - email
        - otp
        - newPassword
      properties:
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
          description: Email
        otp:
          type: string
          example: '12345'
          description: Reset otp from email
        newPassword:
          type: string
          minLength: 8
          example: NewP@ssw0rd123
          description: New password to be set for the user
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          example: P@ssw0rd123
        newPassword:
          type: string
          format: password
          minLength: 8
          example: NewP@ssw0rd123
    AdminUserSummary:
      type: object
      required:
        - id
        - email
        - username
        - fullName
        - role
        - isVerified
        - isLocked
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
        username:
          type: string
          example: student01
        fullName:
          type: string
          example: Nguyễn Văn A
        role:
          type: string
          example: STUDENT
        isVerified:
          type: boolean
          example: true
        isLocked:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    Paging:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
        - hasNext
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1250
        totalPages:
          type: integer
          format: int32
          example: 63
        hasNext:
          type: boolean
          example: true
    AdminUserListResponse:
      type: object
      required:
        - items
        - page
        - size
        - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        paging:
          $ref: '#/components/schemas/Paging'
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          properties:
            lockedAt:
              type: string
              format: date-time
              nullable: true
            lockReason:
              type: string
              nullable: true
    AdminLockRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 255
          example: Suspicious activity / spam
    UserPublicSummary:
      type: object
