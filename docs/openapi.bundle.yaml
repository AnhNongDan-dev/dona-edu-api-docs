      required:
        - title
        - statement
        - difficulty
        - timeLimitMs
        - memoryLimitMb
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: A + B
        statement:
          type: string
          minLength: 1
          maxLength: 50000
          example: Given two integers a and b, output a+b.
