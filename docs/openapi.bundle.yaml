components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRole:
      type: string
      enum:
        - STUDENT
        - TEACHER
      example: STUDENT
    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
        username:
          type: string
          description: Unique username for login / display
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_\.]+$
          example: student01
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: P@ssw0rd123
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          example: Nguyễn Văn A
        role:
          $ref: '#/components/schemas/RegisterRole'
    RegisterResponse:
      type: object
      required:
        - userId
        - email
        - username
        - displayName
        - isVerified
      properties:
        userId:
          type: integer
          format: int64
          example: 1001
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
        username:
          type: string
          example: student01
        displayName:
          type: string
          example: Nguyễn Văn A
        role:
          $ref: '#/components/schemas/RegisterRole'
        isVerified:
          type: boolean
          example: false
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: E_VALIDATION
        message:
          type: string
          example: Invalid request
        details:
          type: object
          additionalProperties: true
          properties:
            fieldErrors:
              type: array
              description: Validation errors per field
              items:
                type: object
                required:
                  - field
                  - reason
                properties:
                  field:
                    type: string
                    example: email
                  reason:
                    type: string
                    example: must be a well-formed email address
    VerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Verify token from email
          example: vfy_eyJhbGciOi...
    SimpleOkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true
    ResendVerifyRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          description: Email or username
          example: student01@dona.edu.vn
        password:
          type: string
          format: password
          example: P@ssw0rd123
    MeResponse:
      type: object
      required:
        - id
        - email
        - username
        - displayName
        - role
        - isVerified
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
        username:
          type: string
          example: student01
        displayName:
          type: string
          example: Nguyễn Văn A
        role:
          type: string
          example: STUDENT
        isVerified:
          type: boolean
          example: true
    TokenPair:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int32
          description: seconds
          example: 3600
        refreshToken:
          type: string
          nullable: true
          description: Optional (only if you implement refresh flow)
          example: rfr_eyJhbGciOi...
    LoginResponse:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/MeResponse'
        tokens:
          $ref: '#/components/schemas/TokenPair'
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          example: P@ssw0rd123
        newPassword:
          type: string
          format: password
          minLength: 8
          example: NewP@ssw0rd123
    AdminUserSummary:
      type: object
      required:
        - id
        - email
        - username
        - displayName
        - role
        - isVerified
        - isLocked
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        email:
          type: string
          format: email
          example: student01@dona.edu.vn
        username:
          type: string
          example: student01
        displayName:
          type: string
          example: Nguyễn Văn A
        role:
          type: string
          example: STUDENT
        isVerified:
          type: boolean
          example: true
        isLocked:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    Paging:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
        - hasNext
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1250
        totalPages:
          type: integer
          format: int32
          example: 63
        hasNext:
          type: boolean
          example: true
    AdminUserListResponse:
      type: object
      required:
        - items
        - page
        - size
        - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        paging:
          $ref: '#/components/schemas/Paging'
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          properties:
            lockedAt:
              type: string
              format: date-time
              nullable: true
            lockReason:
              type: string
              nullable: true
    AdminLockRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 255
          example: Suspicious activity / spam
    AdminResetPasswordRequest:
      type: object
      properties:
        sendEmail:
          type: boolean
          default: true
          description: Send new password to user's email
          example: true
    AdminResetPasswordResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true
        tempPassword:
          type: string
          nullable: true
          description: Optional. Only returned if server policy allows showing it to admin.
          example: X9p2@K1m
    UserPublicSummary:
      type: object
      required:
        - id
        - username
        - displayName
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        username:
          type: string
          example: student01
        displayName:
          type: string
          example: Nguyễn Văn A
        avatarUrl:
          type: string
          nullable: true
          example: https://cdn.example.com/avatars/1001.png
    UserSearchResponse:
      type: object
      required:
        - data
        - paging
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserPublicSummary'
        paging:
          $ref: '#/components/schemas/Paging'
    UserPublicDetail:
      type: object
      required:
        - id
        - username
        - displayName
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        username:
          type: string
          example: student01
        displayName:
          type: string
          example: Nguyễn Văn A
        avatarUrl:
          type: string
          nullable: true
          example: https://cdn.example.com/avatars/1001.png
        bio:
          type: string
          nullable: true
          example: Học sinh lớp 10 chuyên Toán
        createdAt:
          type: string
          format: date-time
          nullable: true
    RoomSummary:
      type: object
      required:
        - id
        - name
        - isArchived
        - createdAt
